name: Compilar APK de Quemarket (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias y sincronizar Capacitor
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Compilar APK Android (Debug)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Preparar archivo Quemarket.apk
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/Quemarket.apk

      - name: Publicar artefacto descargable Quemarket.apk
        uses: actions/upload-artifact@v4
        with:
          name: Quemarket-APK
          path: releases/Quemarket.apk
          retention-days: 30
